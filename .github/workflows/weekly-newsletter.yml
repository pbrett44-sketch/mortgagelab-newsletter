name: Weekly Newsletter Generation

on:
  schedule:
    - cron: '0 9 * * 4'
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          python generate_newsletter.py

      - name: Alert Paul on dead feeds
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f output/feed_failures.json ]; then
            echo "All feeds healthy."
            exit 0
          fi
          echo "::warning::Some RSS feeds returned nothing. See output/feed_failures.json"
          cat output/feed_failures.json
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set — skipping dead-feed alert."
            exit 0
          fi
          CHAT="${TELEGRAM_CHAT_ID:-8343241401}"
          LIST=$(jq -r '.[] | "• \(.name): \(.error)"' output/feed_failures.json)
          MSG=$(printf '📰 MortgageLab newsletter: dead RSS feed(s)\n\nThe newsletter still generated, but these sources returned nothing:\n\n%s\n\nUsually the publisher moved or dropped the feed. Check robots.txt for a Sitemap/feed line, or the homepage for a <link rel="alternate"> tag, then update rss_feeds.json.\n\nRun: %s' "${LIST}" "${RUN_URL}")
          curl -sf --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg cid "$CHAT" --arg t "$MSG" '{chat_id: $cid, text: $t}')" \
            > /dev/null || echo "Telegram alert curl failed — not fatal."

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload newsletter artifacts
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-${{ steps.date.outputs.date }}
          path: |
            output/newsletter_*.html
            output/newsletter_content_*.txt
          retention-days: 90

      - name: Publish draft to Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          python src/mailchimp_publish.py

      - name: Alert Paul on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "TELEGRAM_BOT_TOKEN not set — skipping failure alert."
            exit 0
          fi
          CHAT="${TELEGRAM_CHAT_ID:-8343241401}"
          MSG=$(printf '⚠️ MortgageLab newsletter run FAILED\n\nNo newsletter was generated this week.\n\nMost common cause: the Claude model ID retired and the API now returns 404. Open the failed run, check the "Generate newsletter" step, and if you see a 404 on the model, swap self.model in src/ai_analyser.py and src/content_generator.py to the current Sonnet alias, then push to main.\n\nFailed run: %s\n\nRe-run after fixing: gh workflow run weekly-newsletter.yml --ref main' "${RUN_URL}")
          curl -sf --max-time 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg cid "$CHAT" --arg t "$MSG" '{chat_id: $cid, text: $t}')" \
            > /dev/null || echo "Telegram alert curl failed — not fatal."
