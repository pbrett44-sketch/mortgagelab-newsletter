name: Weekly Newsletter Generation

on:
  schedule:
    - cron: '0 9 * * 4'
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          python generate_newsletter.py

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload newsletter artifacts
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-${{ steps.date.outputs.date }}
          path: |
            output/newsletter_*.html
            output/newsletter_content_*.txt
          retention-days: 90

      - name: Publish draft to Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          python src/mailchimp_publish.py

      - name: Email Paul on failure
        if: failure()
        env:
          ZAPIER_EMAIL_WEBHOOK: ${{ secrets.ZAPIER_EMAIL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$ZAPIER_EMAIL_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg url "$RUN_URL" '{
              to: "pb@btscc.co.uk",
              subject: "⚠️ MortgageLab newsletter run FAILED",
              body: ("The weekly MortgageLab newsletter GitHub Actions run failed and no newsletter was generated this week.\n\nMost common cause: the Claude model ID retired and the API now returns 404. Open the failed run, check the \"Generate newsletter\" step, and if you see a 404 on the model, swap self.model in src/ai_analyser.py and src/content_generator.py to the current Sonnet alias, then push to main.\n\nFailed run: " + $url + "\n\nRe-run after fixing: gh workflow run weekly-newsletter.yml --ref main")
            }')"
