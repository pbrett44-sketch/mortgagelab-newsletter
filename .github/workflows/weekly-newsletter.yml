name: Weekly Newsletter Generation

# Manual-only since 4 Sep 2026. The Thursday schedule moved to
# newsletter-reminder.yml, which prompts Paul to check the manual-story sheet
# and trigger this workflow himself. Nothing here runs, and no API credit is
# spent, until he does.
on:
  workflow_dispatch:

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: |
          python generate_newsletter.py

      - name: Alert Paul on dead feeds
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZAPIER_EMAIL_WEBHOOK: ${{ secrets.ZAPIER_EMAIL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f output/feed_failures.json ]; then
            echo "All feeds healthy."
            exit 0
          fi
          echo "::warning::Some RSS feeds returned nothing. See output/feed_failures.json"
          cat output/feed_failures.json
          LIST=$(jq -r '.[] | "• \(.name): \(.error)"' output/feed_failures.json)
          MSG=$(printf '📰 MortgageLab newsletter: dead RSS feed(s)\n\nThe newsletter still generated, but these sources returned nothing:\n\n%s\n\nUsually the publisher moved or dropped the feed. Check robots.txt for a Sitemap/feed line, or the homepage for a <link rel="alternate"> tag, then update rss_feeds.json.\n\nRun: %s' "${LIST}" "${RUN_URL}")
          SENT=0
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            CHAT="${TELEGRAM_CHAT_ID:-8343241401}"
            if curl -sf --max-time 15 \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg cid "$CHAT" --arg t "$MSG" '{chat_id: $cid, text: $t}')" \
              > /dev/null; then SENT=1; else echo "Telegram send failed — falling back to email."; fi
          fi
          if [ "$SENT" = "0" ] && [ -n "${ZAPIER_EMAIL_WEBHOOK}" ]; then
            curl -sS --max-time 15 -X POST "$ZAPIER_EMAIL_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg b "$MSG" '{to: "pb@btscc.co.uk", subject: "📰 MortgageLab newsletter: dead RSS feed(s)", body: $b}')" \
              > /dev/null && SENT=1
          fi
          [ "$SENT" = "1" ] || echo "::warning::Dead feeds detected but no alert channel configured."

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload newsletter artifacts
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-${{ steps.date.outputs.date }}
          path: |
            output/newsletter_*.html
            output/newsletter_content_*.txt
          retention-days: 90

      - name: Publish draft to Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: |
          python src/mailchimp_publish.py

      - name: Alert Paul on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZAPIER_EMAIL_WEBHOOK: ${{ secrets.ZAPIER_EMAIL_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG=$(printf '⚠️ MortgageLab newsletter run FAILED\n\nNo newsletter was generated this week.\n\nCommon causes: (1) Anthropic API credit balance exhausted — 400 invalid_request_error on every call, top up at console.anthropic.com; (2) the Claude model ID retired — 404 on the model, swap self.model in src/ai_analyser.py and src/content_generator.py to the current Sonnet alias. Open the failed run and check the "Generate newsletter" step.\n\nFailed run: %s\n\nRe-run after fixing: gh workflow run weekly-newsletter.yml --ref main' "${RUN_URL}")
          SENT=0
          if [ -n "${TELEGRAM_BOT_TOKEN}" ]; then
            CHAT="${TELEGRAM_CHAT_ID:-8343241401}"
            if curl -sf --max-time 15 \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg cid "$CHAT" --arg t "$MSG" '{chat_id: $cid, text: $t}')" \
              > /dev/null; then SENT=1; else echo "Telegram send failed — falling back to email."; fi
          fi
          # Fall back to email so a missing/!broken Telegram secret can never leave
          # a failed run unreported.
          if [ "$SENT" = "0" ] && [ -n "${ZAPIER_EMAIL_WEBHOOK}" ]; then
            curl -sS --max-time 15 -X POST "$ZAPIER_EMAIL_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg b "$MSG" '{to: "pb@btscc.co.uk", subject: "⚠️ MortgageLab newsletter run FAILED", body: $b}')" \
              > /dev/null && SENT=1
          fi
          [ "$SENT" = "1" ] || echo "::warning::No alert channel configured — failure went unreported."
