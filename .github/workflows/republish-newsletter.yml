name: Republish Edited Newsletter

# Manual only. Takes newsletter HTML that was edited by hand (e.g. one story
# swapped out) and creates a fresh Mailchimp draft from it, with a test email,
# without re-running the RSS fetch or spending Anthropic credit. The Mailchimp
# key only exists as a repo secret, which is why this has to run here.
#
# Trigger from the Mac:
#   jq -n --arg d 2026-10-15 --rawfile h newsletter.html '{date: $d, html: $h}' \
#     | gh workflow run republish-newsletter.yml --ref main --json
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Newsletter date (YYYY-MM-DD)'
        required: true
      html:
        description: 'Full newsletter HTML'
        required: true

jobs:
  republish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Write edited HTML
        env:
          NEWSLETTER_DATE: ${{ inputs.date }}
          NEWSLETTER_HTML: ${{ inputs.html }}
        run: |
          [[ "$NEWSLETTER_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad date: $NEWSLETTER_DATE"; exit 1; }
          mkdir -p output
          printf '%s' "$NEWSLETTER_HTML" > "output/newsletter_${NEWSLETTER_DATE}.html"
          wc -c "output/newsletter_${NEWSLETTER_DATE}.html"

      - name: Publish draft to Mailchimp
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
        run: python src/mailchimp_publish.py
